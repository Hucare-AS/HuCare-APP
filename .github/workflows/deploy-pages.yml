name: Deploy (Cloudflare Pages)

# main 푸시 → 프로덕션, PR → 미리보기(브랜치별 URL)
# 필요한 설정 (Settings → Secrets and variables → Actions)
#   Secrets:   CLOUDFLARE_API_TOKEN  — 권한: Account · Cloudflare Pages · Edit
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: EXPO_PUBLIC_API_URL   — 비우면 목업 모드로 빌드 (빌드 시점에 번들에 들어감)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_NAME: hucare-webapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Cloudflare 설정 확인
        id: config
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-node@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.config.outputs.enabled == 'true'
        run: npm ci

      - name: Build
        if: steps.config.outputs.enabled == 'true'
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npm run build:pages

      # 최신 wrangler 는 Node 22 이상이 필요하다 (빌드는 .nvmrc 기준으로 끝난 뒤)
      - uses: actions/setup-node@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Deploy
        id: deploy
        if: steps.config.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # 첫 배포 때 Pages 프로젝트가 없으면 만든다 (이미 있으면 무시)
          preCommands: npx wrangler pages project create ${{ env.PROJECT_NAME }} --production-branch=main || true
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.head_ref || github.ref_name }}

      - name: Summary
        if: steps.config.outputs.enabled == 'true'
        run: |
          {
            echo "### Cloudflare Pages"
            echo "- 배포: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- 브랜치 별칭: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
            echo "- API: ${{ vars.EXPO_PUBLIC_API_URL || '(목업 모드)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
